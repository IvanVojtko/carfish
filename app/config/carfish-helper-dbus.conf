<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for carfish-helper: the root service may own the name,
  and the device user may call it (to join the car's WiFi and reroute while
  projecting). The helper itself only drives connman; it exposes no general
  privilege.
-->
<busconfig>
    <policy user="root">
        <allow own="org.carfish.Helper"/>
        <allow send_destination="net.connman"/>
    </policy>
    <policy context="default">
        <allow send_destination="org.carfish.Helper"/>
        <allow receive_sender="org.carfish.Helper"/>
    </policy>
</busconfig>
