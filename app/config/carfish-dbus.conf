<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Carfish needs to join the head unit's WiFi access point programmatically
  (connman Technology/Service/Manager calls) during wireless Android Auto setup.

  The stock connman policy (/usr/share/dbus-1/system.d/connman.conf) only allows
  user="root" and at_console="true"; the app runs as the device's primary user,
  which here is not granted either, so connman returns "Permission denied".

  This grants net.connman access to the primary device user (uid 100000,
  "defaultuser") -- the same capability stock Sailfish normally gives the primary
  user via the privileged group -- scoped to that single user only.
-->
<busconfig>
    <policy user="defaultuser">
        <allow send_destination="net.connman"/>
        <allow send_interface="net.connman.Agent"/>
        <allow send_interface="net.connman.Counter"/>
        <allow send_interface="net.connman.Notification"/>
    </policy>
</busconfig>
