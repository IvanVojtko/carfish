name: Build RPM

# Builds the Carfish RPM for Sailfish OS inside the official community Platform
# SDK container and uploads the packages as artifacts. On a version tag (v*) the
# RPMs are also attached to a GitHub Release.
#
# The buildable project (CMakeLists + rpm/carfish.spec + sources) lives under
# app/, so we build from there (mb2 finds the spec at ./rpm/). Bump SFOS_RELEASE
# to target a newer SDK — it must be a published tag of
# coderus/sailfishos-platform-sdk (https://hub.docker.com/r/coderus/sailfishos-platform-sdk/tags).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  SFOS_RELEASE: "5.1.0.11"

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is the real device target. Add armv7hl (32-bit) / i486
        # (emulator) here if you want those packages too.
        arch: [ aarch64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM in the Sailfish OS Platform SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/RPMS"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e SFOS_RELEASE \
            -e ARCH="${{ matrix.arch }}" \
            "coderus/sailfishos-platform-sdk:${SFOS_RELEASE}" \
            /bin/bash -c '
              set -ex
              # Shadow-build, exactly like "sfdk build ../app" does locally: mb2
              # runs "rpmbuild --build-in-place" and needs the source tree passed
              # as an argument so it builds out-of-source and finds rpm/carfish.spec
              # itself. A bare in-place "mb2 build" on a flat copy has no proper
              # source setup and fails. Copy app/ outside the checked-out git
              # worktree first so mb2 does not attempt VCS patch handling.
              cp -r /workspace/app /tmp/src
              mkdir -p /tmp/shadow && cd /tmp/shadow
              mb2 -t "SailfishOS-${SFOS_RELEASE}-${ARCH}" build /tmp/src
              mkdir -p /workspace/RPMS
              cp -rv RPMS/*.rpm /workspace/RPMS/
            '

      - name: List built RPMs
        run: ls -l "$GITHUB_WORKSPACE/RPMS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carfish-${{ matrix.arch }}-${{ env.SFOS_RELEASE }}
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    name: Attach RPMs to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all RPMs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.rpm
          fail_on_unmatched_files: true
