name: Build RPM

# Builds the Carfish RPM for Sailfish OS inside the official community Platform
# SDK container and uploads the packages as artifacts. On a version tag (v*) the
# RPMs are also attached to a GitHub Release.
#
# The buildable project (CMakeLists + rpm/carfish.spec + sources) lives under
# app/, so we build from there (mb2 finds the spec at ./rpm/). Bump SFOS_RELEASE
# to target a newer SDK — it must be a published tag of
# coderus/sailfishos-platform-sdk (https://hub.docker.com/r/coderus/sailfishos-platform-sdk/tags).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  SFOS_RELEASE: "5.1.0.11"

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is the real device target. Add armv7hl (32-bit) / i486
        # (emulator) here if you want those packages too.
        arch: [ aarch64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The buildable project lives in app/, but the community build action builds
      # from the repo root (it copies the whole workspace and runs mb2 there, which
      # finds rpm/*.spec). Stage app/'s contents at the root so the action — which
      # handles the SDK container, scratchbox2 mounts and build location correctly,
      # unlike a hand-rolled docker run — can build it as-is.
      - name: Stage app/ at the repository root
        run: cp -rT app . && rm -rf app

      - name: Build RPM in the Sailfish OS Platform SDK
        uses: coderus/github-sfos-build@master
        with:
          release: ${{ env.SFOS_RELEASE }}
          arch: ${{ matrix.arch }}

      - name: List built RPMs
        run: ls -l "$GITHUB_WORKSPACE/RPMS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carfish-${{ matrix.arch }}-${{ env.SFOS_RELEASE }}
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    name: Attach RPMs to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all RPMs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.rpm
          fail_on_unmatched_files: true
