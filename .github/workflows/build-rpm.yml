name: Build RPM

# Builds the Carfish RPM for Sailfish OS inside the official community Platform
# SDK container and uploads the packages as artifacts. On a version tag (v*) the
# RPMs are also attached to a GitHub Release.
#
# The buildable project (CMakeLists + rpm/carfish.spec + sources) lives under
# app/, so we build from there (mb2 finds the spec at ./rpm/). Bump SFOS_RELEASE
# to target a newer SDK — it must be a published tag of
# coderus/sailfishos-platform-sdk (https://hub.docker.com/r/coderus/sailfishos-platform-sdk/tags).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  SFOS_RELEASE: "5.1.0.11"

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is the real device target. Add armv7hl (32-bit) / i486
        # (emulator) here if you want those packages too.
        arch: [ aarch64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM in the Sailfish OS Platform SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/RPMS"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e SFOS_RELEASE \
            -e ARCH="${{ matrix.arch }}" \
            "coderus/sailfishos-platform-sdk:${SFOS_RELEASE}" \
            /bin/bash -c '
              set -x
              echo "::group::environment"
              id; mb2 --version 2>&1 | head -3
              echo "--- sb2 targets ---"; sb2-config -l 2>&1 || true
              sdk-assistant list 2>&1 || true
              ls -la ~/.scratchbox2/ 2>&1 || true
              echo "::endgroup::"
              mkdir -p /tmp/build && cd /tmp/build
              cp -r /workspace/app/* .
              ls -la rpm/
              mb2 -t "SailfishOS-${SFOS_RELEASE}-${ARCH}" build
              rc=$?
              echo "::group::post-build diagnostics (rc=$rc)"
              echo "--- .mb2 tree ---"; ls -laR .mb2 2>&1 | head -60
              echo "--- .mb2/spec (first 10 lines) ---"; head -10 .mb2/spec 2>&1
              echo "--- RPMS ---"; ls -la RPMS 2>&1
              echo "::endgroup::"
              if [ "$rc" -ne 0 ]; then exit "$rc"; fi
              mkdir -p /workspace/RPMS
              cp -rv RPMS/*.rpm /workspace/RPMS/
            '

      - name: List built RPMs
        run: ls -l "$GITHUB_WORKSPACE/RPMS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carfish-${{ matrix.arch }}-${{ env.SFOS_RELEASE }}
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    name: Attach RPMs to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all RPMs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.rpm
          fail_on_unmatched_files: true
